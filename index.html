<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora CV Builder</title>
<style>
/* Layout: two-pane studio. Neutral graphite editor (dark default, light option) beside a live A4 sheet. */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e2e2e5; --fg:#18181b; --fg-2:#6b6b74;
  --accent:#18181b; --accent-fg:#ffffff; --accent-soft:#ececee; --stage:#e7e7e9;
  --good:#15803d; --warn:#b45309; --bad:#c2410c;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1c1c1f; --surface-2:#252528; --line:#323237; --fg:#ececee; --fg-2:#9d9da6;
  --accent:#ececee; --accent-fg:#141416; --accent-soft:#2e2e33; --stage:#101012;
  --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1c1c1f; --surface-2:#252528; --line:#323237; --fg:#ececee; --fg-2:#9d9da6;
  --accent:#ececee; --accent-fg:#141416; --accent-soft:#2e2e33; --stage:#101012;
  --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark }
/* the app's own theme switch wins over the host theme */
:root[data-ui="light"]{
  --bg:#f3f3f4; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e2e2e5; --fg:#18181b; --fg-2:#6b6b74;
  --accent:#18181b; --accent-fg:#ffffff; --accent-soft:#ececee; --stage:#e7e7e9;
  --good:#15803d; --warn:#b45309; --bad:#c2410c; --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10); color-scheme:light }
:root[data-ui="dark"]{
  --bg:#141416; --surface:#1c1c1f; --surface-2:#252528; --line:#323237; --fg:#ececee; --fg-2:#9d9da6;
  --accent:#ececee; --accent-fg:#141416; --accent-soft:#2e2e33; --stage:#101012;
  --good:#4ade80; --warn:#fbbf24; --bad:#fb923c; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg-2);outline-offset:2px}
svg.u{width:16px;height:16px;flex:none}

.bar{display:flex;align-items:center;gap:8px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.brand i{width:24px;height:24px;border-radius:7px;background:conic-gradient(from 210deg,#ffd9c2,#cdeee0,#d7d2ff,#ffd9c2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:7px}
.score-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 11px 5px 6px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.score-pill b{font-variant-numeric:tabular-nums}
.score-dot{width:20px;height:20px;border-radius:50%}

.work{display:grid;grid-template-columns:minmax(350px,440px) 1fr;height:calc(100% - 54px);min-height:0}
.panel{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:0;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 11px;cursor:pointer;color:var(--fg-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.pane{overflow:auto;padding:14px 14px 48px;min-height:0;flex:1}
.stage{position:relative;overflow:auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--stage)}
.stage-top{display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--stage) 86%,transparent);backdrop-filter:blur(8px)}
.tplname{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500}
.tplname small{color:var(--fg-2);font-weight:400}
.ex-note{font-size:12px;color:var(--fg-2);border:1px dashed var(--line);border-radius:999px;padding:4px 10px}
.zoom{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--fg-2)}
.zoom input{width:90px;accent-color:var(--fg)}
.sheet-wrap{padding:8px 16px 60px;display:flex;justify-content:center}
.sheet-scale{transform-origin:top center}
.sheet-shadow{box-shadow:var(--shadow);background:#fff;position:relative}
.pbreak{position:absolute;left:-14px;right:-14px;border-top:1.5px dashed #e0565b;pointer-events:none;z-index:9}
.pbreak span{position:absolute;right:0;top:-18px;font:600 10px var(--ui);color:#e0565b;background:var(--stage);padding:1px 6px;border-radius:5px}

.group{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--surface)}
.group>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:600}
.group>summary::-webkit-details-marker{display:none}
.group>summary .chev{margin-left:auto;transition:transform .15s;color:var(--fg-2);display:grid}
.group[open]>summary .chev{transform:rotate(90deg)}
.gbody{padding:4px 12px 12px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.field{display:grid;gap:4px;min-width:0}
.field>span,.lbl{font-size:11.5px;color:var(--fg-2);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;min-width:0}
textarea.inp{resize:vertical;min-height:62px;line-height:1.45}
.row{display:flex;gap:8px;align-items:end;min-width:0}
.row>*{flex:1;min-width:0}
.row>.fit{flex:none;display:flex;gap:2px}
.hint{font-size:11.5px;color:var(--fg-2)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface-2);grid-template-columns:minmax(0,1fr)}
.item .inp,.item .rte{background:var(--surface)}
.item-h{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.item-h strong{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn.danger:hover{color:var(--bad)}
.icon-pick{width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-pick:hover{border-color:var(--fg-2)}
.sec-card{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.sec-card.dragging{opacity:.4}
.sec-card.drop{box-shadow:0 -3px 0 var(--fg)}
.sec-h{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 4px;flex-wrap:wrap}
.sec-h input{flex:1 1 120px;min-width:0;font-weight:600}
.sec-b{padding:0 10px 12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.grip{cursor:grab;color:var(--fg-2);display:grid;place-items:center;width:22px}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(12px)}
.range{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.range input{grid-column:1/-1;width:100%;accent-color:var(--fg)}
.range output{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--fg-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.color{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface-2);min-width:0}
.color input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2)}
.stop>input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.grad-preview{height:64px;border-radius:10px;border:1px solid var(--line)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{width:46px;height:30px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.add{display:flex;gap:6px;flex-wrap:wrap}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.font{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 9px;text-align:left;cursor:pointer;min-width:0}
.font b{display:block;font-size:17px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font small{color:var(--fg-2);font-size:11px;font-family:var(--ui)}
.font[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.drop-zone{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--fg-2)}
.photo-row{display:flex;gap:12px;align-items:center}
.photo-thumb{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);flex:none;position:relative}
.photo-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* rich text */
.rich{position:relative}
.rtb{display:flex;align-items:center;gap:1px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--surface);padding:3px 4px}
.rtb button{border:0;background:none;width:27px;height:26px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.rtb button:hover{background:var(--surface-2);color:var(--fg)}
.rtb button.on{background:var(--accent-soft);color:var(--fg)}
.rtb button svg{width:15px;height:15px}
.rtb .sepv{width:1px;height:16px;background:var(--line);margin:0 4px}
.rte{min-height:64px;border-radius:0 0 8px 8px!important;line-height:1.5;outline:none;overflow-wrap:anywhere;cursor:text}
.rte:focus{border-color:var(--fg-2)}
.rte p,.rte div{margin:0}
.rte ul,.rte ol{margin:2px 0;padding-left:20px}
.rte a{color:#3b82f6;text-decoration:underline}
.rich.inline .rtb{display:none}
.rich.inline:focus-within .rtb{display:flex}
.rich.inline .rte{min-height:0;border-radius:8px!important}
.rich.inline:focus-within .rte{border-radius:0 0 8px 8px!important}
.pop{position:absolute;z-index:30;left:0;top:34px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:grid;gap:8px;min-width:220px}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.sw button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);cursor:pointer}

/* templates gallery */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;padding:8px;text-align:left;display:grid;gap:6px;min-width:0}
.tcard:hover{border-color:var(--fg-2)}
.tcard[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.tthumb{position:relative;overflow:hidden;border-radius:6px;background:#fff;aspect-ratio:210/297;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tthumb .inner{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.tcard b{font-size:13px}
.tcard .note{font-size:11.5px;color:var(--fg-2);line-height:1.35}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid var(--line);color:var(--fg-2)}
.badge.no{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}

/* section presets */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.sgrid button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 6px;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px}
.sgrid button:hover{background:var(--surface-2)}
.sgrid svg{width:22px;height:22px;color:#4c7ef3;flex:none}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:50vh;overflow:auto;padding:2px}
.icon-grid button{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-grid button:hover,.icon-grid button[aria-pressed=true]{border-color:var(--fg);background:var(--accent-soft)}
.icon-grid svg{width:20px;height:20px}

/* ATS */
.ats-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{width:96px;height:96px;flex:none}
.ats-head h3{margin:0 0 4px;font-size:16px}
.check{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;padding:9px 0;border-top:1px solid var(--line)}
.check .st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;margin-top:1px}
.check b{font-weight:600}
.check .why{grid-column:2;color:var(--fg-2);font-size:12px}
.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:320px;overflow:auto}
.kw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.kw span{border-radius:999px;padding:2px 8px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line)}
.kw span.miss{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;max-width:min(560px,calc(100% - 32px));font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 12px;color:var(--fg-2)}
.guide{max-width:600px;padding:0;overflow:hidden}
.g-hero{display:flex;align-items:center;gap:14px;padding:22px 22px 14px}
.g-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;background:conic-gradient(from 210deg,#ffd9c2,#cdeee0,#d7d2ff,#ffd9c2);color:#1d2033}
.g-ic svg{width:22px;height:22px}
.g-hero h3{margin:0;font-size:18px}
.g-hero .step{font-size:12px;color:var(--fg-2)}
.g-body{padding:0 22px 6px;color:var(--fg);line-height:1.55}
.g-body p{color:var(--fg-2);margin:0 0 10px}
.g-body ul{margin:0 0 12px 18px;padding:0;color:var(--fg-2)}
.g-body li{margin:3px 0}
.g-body b{color:var(--fg)}
.g-foot{display:flex;align-items:center;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line);margin-top:8px}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.settings{width:100%;border-collapse:collapse;margin:4px 0 12px;font-size:13px}
.settings td{padding:7px 10px;border-top:1px solid var(--line)}
.settings tr:first-child td{border-top:0}
.settings td:first-child{color:var(--fg-2);width:42%}
.settings td:last-child{font-weight:600}
.settings small{display:block;font-weight:400;color:var(--fg-2)}
.settings-wrap{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
#printRoot{display:none}
.mobile-switch{display:none}
@media (max-width:860px){
  body{overflow:auto}
  .work{grid-template-columns:1fr;height:auto}
  .panel{border-right:0}
  .pane{overflow:visible}
  .work[data-view="edit"] .stage{display:none}
  .work[data-view="preview"] .panel{display:none}
  .mobile-switch{display:flex;gap:6px;width:100%}
  .mobile-switch .btn{flex:1;justify-content:center}
  .zoom{display:none}
}
@media (max-width:420px){.tgrid,.fonts,.sgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
}
</style>

<style id="cv-css">
/* ===== CV sheet (shared by preview, thumbnails, print and the exported file) ===== */
@page{size:A4;margin:12mm 0}
@page:first{margin:0 0 10mm}
.cv{width:210mm;min-height:297mm;position:relative;background:var(--c-base);color:var(--c-text);font-family:var(--c-font);font-size:var(--c-size);line-height:1.28;letter-spacing:var(--c-track);-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden;text-align:left}
.cv *{box-sizing:border-box;margin:0;padding:0}
.cv a{color:inherit;text-decoration:none}
.cv b,.cv strong{font-weight:var(--c-wb)}
.cv i{font-style:italic}.cv u{text-decoration:underline}.cv s{text-decoration:line-through}
.cv h1,.cv .nm{font-family:var(--c-hfont);font-weight:var(--c-wn)}
.cv .hd{font-family:var(--c-hfont);font-weight:var(--c-wh)}
.cv .ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
.cv-bg{position:absolute;inset:0;pointer-events:none;background:var(--c-grad)}
.cv .cv-bg.baked{background-size:100% 100%!important;background-repeat:no-repeat;-webkit-mask-image:none!important;mask-image:none!important;height:auto!important;bottom:0!important}
.cv-inner{position:relative;padding:var(--c-pad-y) var(--c-pad-x) 28pt}
.cv .avatar{overflow:hidden;position:relative;background:var(--c-soft);flex:none;display:grid;place-items:center;color:var(--c-muted);font-weight:600;border-radius:var(--c-pr)}
.cv .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .avatar .ini::before{content:attr(data-i)}
.cv ul{list-style:disc outside;padding-left:1.45em}
.cv ol{list-style:decimal outside;padding-left:1.6em}
.cv li::marker{font-size:.9em}
.cv .rt p,.cv .rt div{margin:0}
.cv .rt ul,.cv .rt ol{margin-top:3pt}
.cv .keep{break-inside:avoid}
.cv .dates{font-variant-numeric:tabular-nums}
.cv .muted{color:var(--c-muted)}
@media print{.cv{overflow:visible;min-height:0}.cv-bg{position:fixed}.t-side .cv-inner{min-height:0!important}.cv-inner,.t-side .s-aside,.t-side .s-main{padding-bottom:0!important}}

/* Aurora (main) */
.t-aurora .a-top{display:flex;align-items:center}
.t-aurora .a-top.right{flex-direction:row-reverse}
.t-aurora .a-pcol{width:var(--c-label);flex:none}
.t-aurora .a-top.right .a-pcol{display:flex;justify-content:flex-end}
.t-aurora h1{font-size:var(--c-name);line-height:1.2;letter-spacing:-.01em}
.t-aurora .a-role{font-size:calc(var(--c-name)*.78);line-height:1.3;font-weight:var(--c-wh);margin-top:4pt}
.t-aurora .a-sum{font-size:var(--c-sum);line-height:1.3;font-weight:500;margin-top:4pt;letter-spacing:-.015em}
.t-aurora .a-sec{display:flex;align-items:baseline;margin-top:var(--c-gap)}
.t-aurora .a-top+.a-sec{margin-top:calc(var(--c-gap) + 2pt)}
.t-aurora .a-sec.div{border-top:.75pt solid var(--c-div);padding-top:var(--c-gap);margin-top:calc(var(--c-gap)*.8)}
.t-aurora .a-label{width:var(--c-label);flex:none;font-size:.95em;line-height:1.2;font-weight:500;color:var(--c-muted);white-space:nowrap}
.t-aurora .a-label .ic{margin-right:5pt;width:1.05em;height:1.05em}
.t-aurora .a-body{flex:1;min-width:0}
.t-aurora .contacts{display:grid;column-gap:22pt;row-gap:3pt;justify-content:start;font-size:.9em;color:var(--c-muted);white-space:nowrap}
.t-aurora .contacts a{display:inline-flex;align-items:center;gap:5pt}
.t-aurora .contacts .ic{width:1.1em;height:1.1em}
.t-aurora .job+.job{margin-top:13pt}
.t-aurora .job h3{font-size:1.2em;line-height:1.25}
.t-aurora .meta{font-size:.8em;color:var(--c-muted);margin-top:2pt}
.t-aurora .grp{font-weight:var(--c-wb);margin-top:6pt}
.t-aurora ul,.t-aurora ol{margin-top:4pt;padding-left:24pt}
.t-aurora .rows .r{display:flex;justify-content:space-between;gap:12pt}
.t-aurora .rows .r+.r{margin-top:4pt}
.t-aurora .rows .r .dates{color:var(--c-muted);white-space:nowrap}

/* Aurora Sidebar */
.t-side .cv-inner{padding:0;display:grid;grid-template-columns:var(--c-label) 1fr;min-height:297mm}
.t-side .s-aside{grid-column:1;grid-row:1;padding:var(--c-pad-y) 18pt 24pt var(--c-pad-x);background:color-mix(in srgb,var(--c-base) 55%,transparent);border-right:.75pt solid var(--c-div)}
.t-side .s-main{grid-column:2;grid-row:1;padding:var(--c-pad-y) var(--c-pad-x) 24pt 22pt;min-width:0}
.t-side .s-aside .avatar{margin-bottom:16pt}
.t-side h1{font-size:calc(var(--c-name)*1.3);line-height:1.1;letter-spacing:-.02em}
.t-side .s-role{font-size:calc(var(--c-name)*.75);font-weight:var(--c-wh);color:var(--c-accent);margin-top:5pt}
.t-side .s-sum{font-size:calc(var(--c-sum)*.78);line-height:1.38;margin-top:9pt}
.t-side .s-h{display:flex;align-items:center;gap:6pt;font-size:.82em;text-transform:uppercase;letter-spacing:.09em;color:var(--c-accent);margin:var(--c-gap) 0 7pt}
.t-side .s-aside>.avatar+.s-h,.t-side .s-aside>.s-h:first-child{margin-top:0}
.t-side .s-h .ic{width:1.15em;height:1.15em}
.t-side .s-main .s-h{border-bottom:.75pt solid var(--c-div);padding-bottom:5pt}
.t-side .clist{display:grid;gap:6pt;font-size:.9em;color:var(--c-muted)}
.t-side .clist a{display:flex;gap:6pt;align-items:center;word-break:break-word}
.t-side .clist .ic{width:1.1em;height:1.1em}
.t-side .job+.job{margin-top:12pt}
.t-side .job h3{font-size:1.12em}
.t-side .meta{font-size:.82em;color:var(--c-muted);margin-top:2pt}
.t-side .grp{font-weight:var(--c-wb);margin-top:6pt}
.t-side ul,.t-side ol{margin-top:3pt;padding-left:14pt}
.t-side .s-aside .rows .r{display:block}
.t-side .s-aside .rows .r+.r{margin-top:6pt}
.t-side .s-aside .rows .dates{display:block;color:var(--c-muted);font-size:.88em}
.t-side .s-aside .skl p+p{margin-top:5pt}
.t-side .s-aside .skl b{display:block}
.t-side .s-main .rows .r{display:flex;justify-content:space-between;gap:10pt}
.t-side .s-main .rows .r+.r{margin-top:4pt}
.t-side .s-main .rows .dates{color:var(--c-muted)}
.t-side .langs-v span{display:block}
.t-side .langs-v span+span{margin-top:3pt}

/* Aurora Spotlight */
.t-spot .cv-bg{bottom:auto;height:calc(var(--c-pad-y) + var(--c-photo) + 70pt);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.t-spot .cv-inner{padding-top:0}
.t-spot .sp-band{display:flex;align-items:center;gap:20pt;padding:var(--c-pad-y) 0 18pt}
.t-spot .sp-band.right{flex-direction:row-reverse}
.t-spot h1{font-size:calc(var(--c-name)*1.45);line-height:1.08;letter-spacing:-.025em}
.t-spot .sp-role{font-size:calc(var(--c-name)*.72);font-weight:var(--c-wh);margin-top:5pt;color:var(--c-accent)}
.t-spot .sp-sum{font-size:calc(var(--c-sum)*.8);line-height:1.38;margin-top:8pt;max-width:120mm}
.t-spot .chips{display:flex;flex-wrap:wrap;gap:6pt;padding:2pt 0 4pt}
.t-spot .chips a{display:inline-flex;align-items:center;gap:5pt;border:.75pt solid var(--c-div);border-radius:999px;padding:3.5pt 9pt;font-size:.88em;color:var(--c-muted);background:color-mix(in srgb,var(--c-base) 70%,transparent)}
.t-spot .chips .ic{width:1.05em;height:1.05em}
.t-spot .sp-h{display:flex;align-items:center;gap:7pt;margin:var(--c-gap) 0 8pt;font-size:.8em;text-transform:uppercase;letter-spacing:.1em;color:var(--c-accent)}
.t-spot .sp-h::after{content:"";flex:1;border-top:.75pt solid var(--c-div)}
.t-spot .sp-h .ic{width:1.2em;height:1.2em}
.t-spot .job+.job{margin-top:12pt}
.t-spot .jh{display:flex;justify-content:space-between;gap:12pt;align-items:baseline}
.t-spot .jh h3{font-size:1.12em}
.t-spot .jh .dates{font-size:.86em;color:var(--c-muted);white-space:nowrap}
.t-spot .meta{font-size:.86em;color:var(--c-muted);margin-top:1pt}
.t-spot .grp{font-weight:var(--c-wb);margin-top:6pt}
.t-spot ul,.t-spot ol{margin-top:3pt;padding-left:15pt}
.t-spot .rows .r{display:flex;justify-content:space-between;gap:12pt}
.t-spot .rows .r+.r{margin-top:4pt}
.t-spot .rows .dates{color:var(--c-muted);white-space:nowrap}
.t-spot .skl{display:grid;grid-template-columns:max-content 1fr;gap:3pt 12pt}

/* Glass */
.t-glass{letter-spacing:-.01em}
.t-glass .cv-inner{padding:var(--c-pad-y) var(--c-pad-x) 24pt}
.t-glass .glass{position:relative;border-radius:20pt;background:rgba(255,255,255,calc(var(--c-glass) + .12));border:.8pt solid rgba(255,255,255,.95);outline:.6pt solid rgba(38,48,110,.07)}
.t-glass.glass-art .glass{background:transparent;outline:none;border:.8pt solid rgba(255,255,255,.7)}
.t-glass.glass-art .g-chips a{background:transparent!important;border-color:rgba(255,255,255,.75)!important}
.t-glass.glass-art .cv-bg.baked{position:absolute!important;background-size:100% auto!important;background-position:0 0!important}
.t-glass .glass>*{position:relative;z-index:1}
.t-glass .g-card{break-inside:avoid}
.t-glass .g-head{padding:14pt 16pt 12pt}
.t-glass .g-top{display:flex;align-items:center;gap:16pt}
.t-glass .g-top.right{flex-direction:row-reverse}
.t-glass .g-top .avatar{box-shadow:0 0 0 3pt rgba(255,255,255,.85)}
.t-glass h1{font-size:calc(var(--c-name)*1.55);line-height:1.02;letter-spacing:-.035em}
.t-glass .g-role{font-size:calc(var(--c-name)*.72);font-weight:var(--c-wh);color:var(--c-accent);margin-top:4pt;letter-spacing:-.015em}
.t-glass .g-sum{font-size:calc(var(--c-sum)*.8);line-height:1.4;color:var(--c-muted);margin-top:6pt}
.t-glass .g-sum b{color:var(--c-text)}
.t-glass .g-chips{display:flex;flex-wrap:wrap;gap:5pt;margin-top:11pt}
.t-glass .g-chips a{display:inline-flex;align-items:center;gap:4pt;padding:3pt 8.5pt;border-radius:999px;font-size:.88em;background:rgba(255,255,255,.82);border:.7pt solid rgba(38,48,110,.08)}
.t-glass .g-chips .ic{color:var(--c-accent);width:1.05em;height:1.05em}
.t-glass .g-card{margin-top:var(--c-gap);padding:11pt 15pt 12pt}
.t-glass .g-h{display:flex;align-items:center;gap:8pt;font-size:1.18em;margin-bottom:9pt;letter-spacing:-.02em}
.t-glass .g-ic{width:20pt;height:20pt;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--c-accent);border:.8pt solid rgba(255,255,255,.55)}
.t-glass .g-ic .ic{width:11pt;height:11pt}
.t-glass .job+.job{margin-top:11pt;padding-top:11pt;border-top:.7pt solid rgba(255,255,255,.85)}
.t-glass .jh{display:flex;justify-content:space-between;gap:12pt;align-items:baseline}
.t-glass .jh h3{font-size:1.08em}
.t-glass .jh .dates{font-size:.86em;color:var(--c-muted);white-space:nowrap;padding:1pt 7pt;border-radius:999px;background:rgba(255,255,255,.55);border:.6pt solid rgba(255,255,255,.9)}
.t-glass .meta{font-size:.9em;color:var(--c-muted);margin-top:1pt}
.t-glass .grp{font-weight:var(--c-wb);margin-top:6pt;font-size:.95em}
.t-glass ul,.t-glass ol{margin-top:3pt;padding-left:14pt}
.t-glass li::marker{color:var(--c-accent)}
.t-glass .rows .r{display:flex;justify-content:space-between;gap:12pt}
.t-glass .rows .r+.r{margin-top:5pt}
.t-glass .rows .dates{color:var(--c-muted);white-space:nowrap}
.t-glass .skl{display:grid;grid-template-columns:max-content 1fr;gap:4pt 12pt}
.t-glass .pair{display:flex;gap:var(--c-gap)}
.t-glass .pair>.g-card{flex:1 1 0;min-width:0}
/* Glass: the frosted panels, their shadows and light rims are painted into one background image
   (see glassArt), so screen and PDF look the same and the PDF stays fast to open. */

/* Simple ATS */
.t-ats{line-height:1.32}
.t-ats .cv-bg{display:none}
.t-ats h1{font-size:calc(var(--c-name)*1.15);text-align:center;letter-spacing:.01em}
.t-ats .x-role{text-align:center;font-size:1.1em;margin-top:2pt}
.t-ats .x-contact{text-align:center;font-size:.92em;margin-top:5pt}
.t-ats .x-contact .pp{color:var(--c-muted)}
.t-ats h2{font-size:1.05em;text-transform:uppercase;letter-spacing:.04em;border-bottom:.9pt solid var(--c-text);padding-bottom:2pt;margin:var(--c-gap) 0 6pt;color:var(--c-accent)}
.t-ats .job+.job{margin-top:10pt}
.t-ats .jh{display:flex;justify-content:space-between;gap:12pt}
.t-ats .jh h3{font-size:1em}
.t-ats .meta{font-style:italic}
.t-ats .grp{font-weight:var(--c-wb);margin-top:4pt}
.t-ats ul,.t-ats ol{margin-top:2pt;padding-left:16pt}
.t-ats .rows .r{display:flex;justify-content:space-between;gap:12pt}
.t-ats .rows .r+.r{margin-top:2pt}

/* Classic (serif name, sans body, spaced caps headings) */
.t-classic{line-height:1.4}
.t-classic .cv-bg{display:none}
.t-classic .c-head{text-align:center}
.t-classic h1{font-size:var(--c-name);line-height:1.15;letter-spacing:.005em}
.t-classic .c-role{font-family:var(--c-hfont);font-style:italic;font-size:calc(var(--c-name)*.42);color:#333;margin-top:6pt}
.t-classic .c-contact{margin-top:12pt;border-top:.6pt solid var(--c-div);border-bottom:.6pt solid var(--c-div);padding:5pt 0;text-align:center;font-size:.86em}
.t-classic .c-contact .pp{color:#9a9a9a;margin:0 4pt}
.t-classic .c-contact a.lk{color:var(--c-accent)}
.t-classic h2{font-family:var(--c-font);font-size:.82em;font-weight:700;text-transform:uppercase;letter-spacing:.26em;border-bottom:.6pt solid var(--c-div);padding-bottom:4pt;margin:var(--c-gap) 0 9pt}
.t-classic .c-sum{text-align:justify}
.t-classic .job+.job{margin-top:8pt}
.t-classic .jh{display:flex;justify-content:space-between;gap:12pt;align-items:baseline}
.t-classic .jh h3{font-size:1em;font-family:var(--c-font)}
.t-classic .jh h3 .co{font-weight:400;color:var(--c-muted)}
.t-classic .jh h3 .pp{font-weight:400;color:#9a9a9a;margin:0 2pt}
.t-classic .jh .dates{font-size:.86em;text-transform:uppercase;letter-spacing:.14em;color:#666;white-space:nowrap}
.t-classic .grp{font-weight:var(--c-wb);margin-top:4pt}
.t-classic ul,.t-classic ol{margin-top:3pt;padding-left:20pt}
.t-classic li{margin-top:1.5pt;text-align:justify}
.t-classic .skl{display:grid;grid-template-columns:max-content 1fr;gap:4pt 14pt}
.t-classic .rows .r{display:flex;justify-content:space-between;gap:12pt}
.t-classic .rows .r+.r{margin-top:4pt}
.t-classic .rows .co{color:var(--c-muted)}
.t-classic .rows .pp{color:#9a9a9a;margin:0 2pt}
.t-classic .rows .dates{font-size:.86em;letter-spacing:.14em;color:#777;text-transform:uppercase;white-space:nowrap}

/* Garamond Banner */
.t-banner{line-height:1.25}
.t-banner .cv-bg{display:none}
.t-banner .b-head{text-align:center}
.t-banner h1{font-size:var(--c-name);text-transform:uppercase;letter-spacing:.08em;line-height:1.1}

.t-banner .b-title{font-weight:var(--c-wb);margin-bottom:4pt}
.t-banner .b-row{display:flex;align-items:baseline;gap:5pt}

.t-banner .b-row .dm svg{width:9pt;height:9pt}
.t-banner .b-row h3,.t-banner .b-row .t{font-family:var(--c-font);font-weight:500;font-size:1.03em;flex:none;max-width:75%}
.t-banner .b-row .lead{flex:1;border-bottom:.9pt dotted #888;transform:translateY(-2.5pt);min-width:12pt}
.t-banner .b-row .dates{flex:none;font-size:.92em}
.t-banner .job+.job{margin-top:10pt}
.t-banner .grp{font-weight:var(--c-wb);margin-top:6pt;font-size:.92em}
.t-banner .rt{font-size:.92em}
.t-banner ul,.t-banner ol{margin-top:3pt;padding-left:22pt}
.t-banner .rows .r+.r{margin-top:5pt}
.t-banner .skl p+p{margin-top:1pt}

/* Details (photo square, right details column) */
.t-details{line-height:1.38}
.t-details .cv-bg{display:none}
.t-details .d-top{display:flex;align-items:center;gap:14pt;margin-bottom:12pt}
.t-details h1{font-size:var(--c-name);line-height:1.1;letter-spacing:-.005em}
.t-details .d-cols{display:grid;grid-template-columns:1fr var(--c-label);gap:30pt}
.t-details .d-main{min-width:0}

.t-details .d-h .ic{width:.62em;height:.62em;stroke-width:3}
.t-details .d-sh{font-weight:var(--c-wb);font-size:1.05em;margin:12pt 0 2pt}
.t-details .d-side>.d-sh:first-child{margin-top:0}
.t-details .d-side .cl a{display:block;overflow-wrap:anywhere}
.t-details .d-title{font-weight:var(--c-wb);margin-bottom:6pt}
.t-details .job+.job{margin-top:9pt}
.t-details .job h3{font-size:1.02em;font-family:var(--c-font)}
.t-details .meta{font-size:.78em;color:var(--c-muted);margin-top:1pt}
.t-details .grp{font-weight:var(--c-wb);margin-top:4pt}
.t-details ul,.t-details ol{margin-top:5pt;padding-left:24pt}
.t-details li{margin-top:1pt}
.t-details .rows .r+.r{margin-top:5pt}
.t-details .rows .dates{display:block;font-size:.8em;color:var(--c-muted)}
.t-details .d-side .langs-v span{display:block}
</style>

<header class="bar">
  <div class="brand"><i aria-hidden="true"></i>Aurora CV Builder</div>

  <button class="btn" id="btnNew" data-u="file-plus">New CV</button>

</header>

/* print background: bake the soft gradient into one image. CSS gradients with transparency
   become full-page soft masks in a PDF, which makes Acrobat and browsers slow to draw the page. */
const bakeCache={};
function bakedBg(T,d){
 if(!d.gradOn||!d.grad||!d.grad.stops.length||['ats','classic','banner','details'].includes(T))return '';
 const W=900,H=1273,pt=W/595.28;const key=JSON.stringify([T,d.grad,d.padY,d.photo]);if(bakeCache[key])return bakeCache[key];
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 const L=document.createElement('canvas');L.width=W;L.height=H;const l=L.getContext('2d');
 let bh=H;if(T==='spot')bh=Math.min(H,Math.round((d.padY+(d.photo||80)+70)*pt));
 const stops=[...d.grad.stops].reverse();
 for(const s of stops){const cx=s.x/100*W,cy=s.y/100*bh;const r=Math.max(...[[0,0],[W,0],[0,bh],[W,bh]].map(([x,y])=>Math.hypot(x-cx,y-cy)));
  const gr=l.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,r*s.size/100));gr.addColorStop(0,hexA(s.color,s.opacity));gr.addColorStop(1,hexA(s.color,0));l.fillStyle=gr;l.fillRect(0,0,W,bh)}
 if(T==='spot'){l.globalCompositeOperation='destination-in';const m=l.createLinearGradient(0,0,0,bh);m.addColorStop(0,'#000');m.addColorStop(.55,'#000');m.addColorStop(1,'rgba(0,0,0,0)');l.fillStyle=m;l.fillRect(0,0,W,bh);l.globalCompositeOperation='source-over'}
 g.fillStyle=d.grad.base||'#ffffff';g.fillRect(0,0,W,H);g.drawImage(L,0,0);
 return bakeCache[key]=c.toDataURL('image/jpeg',.9);
}


/* Glass: paint a real frosted-glass layer. The wallpaper is blurred, tinted and lit inside each panel,
   with soft drop shadows and light rims, all into one image behind the text. */
let LAST_GLASS='';const wpCache={};
function relRect(el,root){let x=0,y=0,e=el;while(e&&e!==root){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return {x,y,w:el.offsetWidth,h:el.offsetHeight}}

function wallpaper(d,W,H,s){
 const key=JSON.stringify([d.grad,W,H,s]);if(wpCache[key])return wpCache[key];

 const wp=document.createElement('canvas');wp.width=cw;wp.height=ch;const g=wp.getContext('2d');
 g.fillStyle=d.grad.base||'#eef1f8';g.fillRect(0,0,cw,ch);
 const st=d.grad.stops.length?d.grad.stops:GRAD_PRESETS.Tahoe.stops;
 for(let p=0;p*PH<H;p++){
  const oy=p*PH*s;
  st.forEach((o,i)=>{const cx=o.x/100*cw,cy=oy+o.y/100*PH*s,r=(.18+o.size/100*.42)*cw;
   const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,hexA(o.color,Math.min(1,o.opacity*1.05)));gr.addColorStop(.62,hexA(o.color,o.opacity*.8));gr.addColorStop(1,hexA(o.color,0));
   g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill()});

 const bl=document.createElement('canvas');bl.width=cw;bl.height=ch;const b=bl.getContext('2d');

 b.imageSmoothingQuality='high';b.drawImage(sm2,0,0,cw,ch);
 b.globalCompositeOperation='saturation';b.fillStyle='hsl(0,60%,50%)';b.globalAlpha=.25;b.fillRect(0,0,cw,ch);b.globalAlpha=1;b.globalCompositeOperation='source-over';

}
function glassArt(cv,d){
 const W=cv.offsetWidth,H=Math.max(cv.offsetHeight,1123),s=1.5;if(!W)return '';
 const panels=[...cv.querySelectorAll('.glass,.g-chips a')].map(el=>Object.assign(relRect(el,cv),{r:parseFloat(getComputedStyle(el).borderTopLeftRadius)||12,chip:el.tagName==='A'}));
 const {wp,bl}=wallpaper(d,W,H,s);
 const c=document.createElement('canvas');c.width=wp.width;c.height=wp.height;const g=c.getContext('2d');g.drawImage(wp,0,0);
 const tint=Math.max(.12,Math.min(.8,d.glass));
 for(const p of panels){
  const x=p.x*s,y=p.y*s,w=p.w*s,h=p.h*s,r=p.r*s;
  g.save();g.shadowColor=p.chip?'rgba(30,40,100,.16)':'rgba(30,40,100,.20)';g.shadowBlur=(p.chip?8:34)*s;g.shadowOffsetY=(p.chip?2:14)*s;rr(g,x,y,w,h,r);g.fillStyle='rgba(255,255,255,1)';g.fill();g.restore();
  g.save();rr(g,x,y,w,h,r);g.clip();
  g.drawImage(bl,0,0);                                   // frosted: what is behind, blurred
  g.fillStyle=`rgba(255,255,255,${p.chip?tint+.18:tint})`;g.fillRect(x,y,w,h);   // milky tint
  const sh=g.createLinearGradient(0,y,0,y+h*.55);sh.addColorStop(0,'rgba(255,255,255,.38)');sh.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sh;g.fillRect(x,y,w,h); // top sheen
  const gl=g.createRadialGradient(x,y,0,x,y,Math.max(w,h)*.7);gl.addColorStop(0,'rgba(255,255,255,.28)');gl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gl;g.fillRect(x,y,w,h); // corner glint
  const bot=g.createLinearGradient(0,y+h*.7,0,y+h);bot.addColorStop(0,'rgba(255,255,255,0)');bot.addColorStop(1,'rgba(255,255,255,.16)');g.fillStyle=bot;g.fillRect(x,y,w,h); // light caught at the lower edge
  g.restore();
  g.save();rr(g,x+.75*s,y+.75*s,w-1.5*s,h-1.5*s,Math.max(0,r-.75*s));const rim=g.createLinearGradient(x,y,x+w*.6,y+h);rim.addColorStop(0,'rgba(255,255,255,.95)');rim.addColorStop(.45,'rgba(255,255,255,.35)');rim.addColorStop(1,'rgba(255,255,255,.7)');g.strokeStyle=rim;g.lineWidth=1.5*s;g.stroke();g.restore(); // light rim
 }
 return c.toDataURL('image/jpeg',.9);
}
function applyGlass(cv,d){if(!cv||!cv.classList.contains('t-glass'))return '';const url=glassArt(cv,d);if(!url)return '';const bg=cv.querySelector('.cv-bg');bg.classList.add('baked');bg.style.backgroundImage=`url(${url})`;cv.classList.add('glass-art');return url}

const MM=96/25.4,P1=287*MM,PN=273*MM;

const HEAD_SYN={experience:/(experience|employment|work history|career|professional background)/i,education:/(education|academic|certification|qualification|training|courses)/i,skills:/(skill|competenc|tools|tech|expertise)/i};
function cvText(){const cv=$('#sheet .cv');return cv?cv.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').trim():''}
function analyze(){
 const T=S.template,text=cvText(),lines=text.split('\n').map(l=>l.trim()).filter(Boolean),checks=[];
 const add=(w,ok,label,why)=>checks.push({w,ok,label,why});
 const name=S.profile.name.trim();const first=lines[0]||'';const nameOk=name&&first.toLowerCase()===name.toLowerCase();
 add(10,nameOk?1:name?.3:0,'Name is the first thing a parser reads',name?(nameOk?'The first text line is your name, so it lands in the Name field.':`The first text line is "${first}". Parsers may take that as your name.`):'Add your full name.');
 const em=text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);add(10,em?1:0,'Email address in plain text',em?em[0]:'Add an email contact and keep it visible.');
 const ph=text.match(/\+?\d[\d\s().-]{7,}\d/);add(8,ph?1:0,'Phone number in plain text',ph?ph[0].trim():'Add a phone number.');
 add(3,visContacts().some(c=>c.type==='location')?1:0,'Location (city, country)','Recruiters filter by location; a city and country is enough.');
 const links=visContacts().filter(c=>LINKISH.includes(c.type));const printsFull=['ats','classic','banner','details'].includes(T);
 const bad=links.filter(c=>!/[a-z0-9-]+\.[a-z]{2,}/i.test(c.text));

function loadScript(srcs){return new Promise((res,rej)=>{const tryOne=i=>{if(i>=srcs.length)return rej(new Error('load'));const s=document.createElement('script');s.src=srcs[i];s.onload=res;s.onerror=()=>{s.remove();tryOne(i+1)};document.head.appendChild(s)};tryOne(0)})}
let IMPORT_LINKS=[],IMPORT_PHOTO='',IMPORT_BOLD=new Set();
async function pdfLines(buf){
 if(!window.pdfjsLib){
  await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js']);
  await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']);
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 }
 const doc=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;const out=[];IMPORT_LINKS=[];IMPORT_PHOTO='';IMPORT_BOLD=new Set();
 for(let p=1;p<=doc.numPages;p++){
  const page=await doc.getPage(p);try{await page.getOperatorList()}catch(_){}const tc=await page.getTextContent();const rows=[];
  const boldF={};const isBold=fn=>{if(fn in boldF)return boldF[fn];let b=false;try{const f=page.commonObjs.get(fn);b=!!(f&&(f.bold||/bold|semibold|demi|black|heavy/i.test(f.name||'')))}catch(_){}try{if(!b)b=/bold/i.test(tc.styles[fn]?.fontFamily||'')}catch(_){}return boldF[fn]=b};
  try{(await page.getAnnotations()).forEach(an=>{const u=an.url||an.unsafeUrl;if(u)IMPORT_LINKS.push(u)})}catch(_){}
  if(p===1&&!IMPORT_PHOTO){try{IMPORT_PHOTO=await pdfPhoto(page)}catch(_){}}
  tc.items.forEach(it=>{if(!it.str.trim())return;const y=it.transform[5],x=it.transform[4],h=it.height||Math.abs(it.transform[3]);let r=rows.find(r=>Math.abs(r.y-y)<Math.max(2,h*.45));if(!r){r={y,h,items:[]};rows.push(r)}r.items.push({x,s:it.str,w:it.width,h,b:isBold(it.fontName)})});
  rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.items.sort((a,b)=>a.x-b.x);{const all=r.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();let run=[];const flush=()=>{const t=run.join(' ').replace(/\s+/g,' ').replace(/^[\s•·-]+|[\s:,]+$/g,'').trim();if(t.length>=2&&t!==all.replace(/[\s:]+$/,''))IMPORT_BOLD.add(t);run=[]};r.items.forEach(i=>{if(i.b)run.push(i.s);else flush()});flush()}let line='',end=null;const fh=r.h||8;r.items.forEach(i=>{const gap=end==null?0:i.x-end;if(end!=null&&gap>fh*2.5)line+='   ';else if(end!=null&&gap>Math.max(.5,fh*.06)&&!line.endsWith(' ')&&!i.s.startsWith(' '))line+=' ';line+=i.s;end=i.x+i.w});line.split(/\s{3,}/).forEach(x=>out.push(x.trim()))});
 }
 return out;
}
async function pdfPhoto(page){
 const ops=await page.getOperatorList();const vp=page.getViewport({scale:1});const cands=[];
 for(let k=0;k<ops.fnArray.length;k++){if(ops.fnArray[k]===pdfjsLib.OPS.paintImageXObject)cands.push(ops.argsArray[k][0])}
 let best=null;
 for(const id of cands){
  const img=await new Promise(res=>{try{page.objs.get(id,res)}catch(_){res(null)}});if(!img)continue;
  const w=img.width,h=img.height,ar=w/h;
  if(w<80||h<80||ar<.6||ar>1.6)continue;
  if(Math.abs(ar-vp.width/vp.height)<.03&&w>=vp.width*.9)continue;
  if(!best||w*h>best.w*best.h)best={img,w,h};
 }
 if(!best)return '';
 const k=Math.min(1,900/Math.max(best.w,best.h));const c=document.createElement('canvas');c.width=Math.round(best.w*k);c.height=Math.round(best.h*k);const g=c.getContext('2d');
 const im=best.img;
 if(im.bitmap){g.drawImage(im.bitmap,0,0,c.width,c.height)}
 else if(im.data){const t=document.createElement('canvas');t.width=best.w;t.height=best.h;const id=t.getContext('2d').createImageData(best.w,best.h);const src=im.data;
  if(src.length===best.w*best.h*4)id.data.set(src);else if(src.length===best.w*best.h*3){for(let i=0,j=0;i<src.length;i+=3,j+=4){id.data[j]=src[i];id.data[j+1]=src[i+1];id.data[j+2]=src[i+2];id.data[j+3]=255}}else return '';
  t.getContext('2d').putImageData(id,0,0);g.drawImage(t,0,0,c.width,c.height)}
 else return '';
 return c.toDataURL('image/jpeg',.88);
}

async function importFile(f){

  let lines;const ext=f.name.toLowerCase().split('.').pop();
  IMPORT_LINKS=[];IMPORT_PHOTO='';
  if(ext==='pdf')lines=await pdfLines(await f.arrayBuffer());
  else if(ext==='docx'){if(!window.mammoth)await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js']);const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});lines=r.value.split('\n')}
  else lines=(await f.text()).split('\n');
  const d=parseCV(lines);
  d.designs=S.designs;d.template=S.template;if(S.profile.photo.src&&!d.profile.photo.src)d.profile.photo=S.profile.photo;
  S=normalize(d);applyBold();OPEN.clear();renderPane();renderPreview();
  const roles=S.sections.filter(s=>s.type==='experience').reduce((a,s)=>a+s.items.length,0);
  toast(`Imported: ${S.sections.length} sections, ${roles} roles. Please review each field.`);
 }catch(err){console.error(err);toast(err&&err.message==='load'?'The import tools could not load. Check your internet connection and try again.':'This file could not be read. Try exporting it as PDF or DOCX again.')}
}
function parseCV(raw){

 const lines=[];
 raw.map(l=>l.replace(/ /g,' ').replace(/[ \t]+/g,' ').trim()).filter(Boolean).forEach(l=>{
  const low=l.toLowerCase();const ph=PHR.find(p=>low.startsWith(p+' ')&&/^[A-Z]/.test(l));

 let locLine='';for(const l of headLines){const mm=l.replace(/^(location|address|city)\s*:\s*/i,'').match(/(?:^[^\p{L}]*|[,|\/•]\s*)([\p{Lu}][\p{L}]+(?: [\p{Lu}][\p{L}]+)?(?:,\s*|\s[-–]\s)[\p{Lu}][\p{L}]+(?: [\p{Lu}][\p{L}]+)?)\s*$/u);if(mm&&!/@/.test(mm[1])&&!/(engineer|developer|manager|lead|tester|history|skills|tools)/i.test(mm[1])&&!/\d{4}/.test(l)){locLine=mm[1];break}}
 if(!locLine)for(const l of headLines){const mm=l.match(/(?:^|\s)([\p{Lu}][\p{L}]+(?: [\p{Lu}][\p{L}]+)?,\s*[\p{Lu}][\p{L}]+(?: [\p{Lu}][\p{L}]+)?)(?=\s+(?:https?:|www\.|\+|\d|[\w.+-]+@)|\s*$)/u);if(mm&&!/(engineer|developer|manager|lead|tester)/i.test(mm[1])){locLine=mm[1];break}}
 if(locLine)add('location',locLine.replace(/\s+-\s+/,', '));

 const clean=u=>u.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,'');

 const urlRe=/\b((https?:\/\/)?(www\.)?(linkedin\.com|github\.com|gitlab\.com|behance\.net|dribbble\.com)\/[\w\-./%]+|(https?:\/\/)[\w\-.]+\.[a-z]{2,}[\w\-./?=&%#]*|\b[a-z0-9-]+\.(com|dev|io|me|rs|net|org|app|co)\b(\/[\w\-./%]*)?)/gi;
 (headLines.join('\n').match(urlRe)||[]).concat((full.match(/\b(https?:\/\/)?(www\.)?(linkedin\.com|github\.com|gitlab\.com|behance\.net|dribbble\.com)\/[\w\-.\/%]+/gi)||[])).filter(u=>!email||!email[0].toLowerCase().includes(u.toLowerCase())).forEach(u=>{const c=clean(u);if(d.contacts.some(x=>x.text.toLowerCase()===c.toLowerCase()||(x.url&&clean(x.url).toLowerCase()===c.toLowerCase())))return;add(typeOf(u),c,'https://'+c)});

 let i=0;const header=[];

 if(nameIdx>=0){d.profile.name=titleCase(hdr[nameIdx]);const nx=hdr[nameIdx+1];d.profile.title=nx&&nx.length<70&&!/[.!?]$/.test(nx)?nx:'';const rest=hdr.slice(nameIdx+(d.profile.title?2:1));if(rest.length)d.profile.summary=rest.join(' ')}

 const DATE=/((jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{4}|\d{1,2}[\/.]\d{4}|\d{4})\s*(?:[-–—]+|to)\s*((jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{4}|\d{1,2}[\/.]\d{4}|\d{4}|present|current|now)/i;

  const DEFAULT_ICONS={experience:'briefcase',skills:'wrench',education:'graduation-cap',languages:'languages',text:'user',list:'star'};
  const sec={id:uid(),type:b.type==='summary'?'text':b.type,label:b.label,icon:DEFAULT_ICONS[b.type==='summary'?'text':b.type]||'star',show:true,side:['skills','languages'].includes(b.type),items:[],body:''};
  if(b.type==='contact')return;

function titleCase(s){return s&&s===s.toUpperCase()&&/[A-Z]/.test(s)?s.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):s}


function applyBold(){
 const P=[...IMPORT_BOLD].filter(p=>p.length>=2&&p.length<120).sort((a,b)=>b.length-a.length);if(!P.length)return;
 const rx=new RegExp('('+P.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
 const fix=h=>{if(!h)return h;const d=document.createElement('div');d.innerHTML=h;const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(n.parentElement.closest('b'))return;const t=n.nodeValue;if(!rx.test(t))return;rx.lastIndex=0;const span=document.createElement('span');span.innerHTML=esc(t).replace(new RegExp(rx.source.replace(/&/g,'&amp;'),'g'),'<b>$1</b>');n.replaceWith(...span.childNodes)});return d.innerHTML};
 S.profile.summary=fix(S.profile.summary);
 S.sections.forEach(s=>{if(s.type==='experience')s.items.forEach(it=>it.groups.forEach(g=>g.html=fix(g.html)));if(s.type==='skills')s.items.forEach(r=>r.value=fix(r.value));if(s.type==='text')s.body=fix(s.body)});
}

const FONT_SOURCES={"inter":["inter","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"calibri":["carlito","5.3.0",[[400,0],[400,1],[700,0],[700,1]]],"arial":["arimo","5.3.0",[[400,0],[400,1],[500,0],[600,0],[700,0],[700,1]]],"helv":["roboto","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"sourcesans":["source-sans-3","5.3.1",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"lato":["lato","5.3.0",[[300,0],[400,0],[400,1],[700,0],[700,1]]],"opensans":["open-sans","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"plex":["ibm-plex-sans","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1]]],"dmsans":["dm-sans","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"manrope":["manrope","5.3.0",[[300,0],[400,0],[500,0],[600,0],[700,0],[800,0]]],"figtree":["figtree","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"nunito":["nunito-sans","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"garamond":["eb-garamond","5.3.0",[[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"times":["tinos","5.3.0",[[400,0],[400,1],[700,0],[700,1]]],"dejavu":["noto-serif","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"sourceserif":["source-serif-4","5.3.1",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"merriweather":["merriweather","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"baskerville":["libre-baskerville","5.3.0",[[400,0],[400,1],[500,0],[600,0],[700,0],[700,1]]],"crimson":["crimson-pro","5.3.0",[[300,0],[400,0],[400,1],[500,0],[600,0],[700,0],[700,1],[800,0]]],"ptserif":["pt-serif","5.3.0",[[400,0],[400,1],[700,0],[700,1]]]};      // the same families as static files from Fontsource (used by the single-file version)
const isFileUrl=location.protocol==='file:';
const UR_LATIN='U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+FEFF,U+FFFD';
const UR_EXT='U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF';
const fkey=k=>k==='sf'?'inter':(FONT_SOURCES[k]?k:'inter');
const SERIF=new Set(['garamond','times','dejavu','sourceserif','merriweather','baskerville','crimson','ptserif']);
function famCss(k){
 if(k==='sf')return '-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","CVX-inter",sans-serif';
 if(k==='calibri')return 'Calibri,"CVX-calibri","Segoe UI",Arial,sans-serif';
 const key=fkey(k);return `"CVX-${key}",${SERIF.has(key)?'Georgia,"Times New Roman",serif':'Arial,"Helvetica Neue",sans-serif'}`;
}
const fontBuf={};let localFonts=null; // null = unknown, true = fonts/ folder is reachable, false = use Fontsource
async function canUseLocal(){
 if(localFonts!==null)return localFonts;
 if(isFileUrl)return localFonts=false;
 try{const r=await fetch('fonts/inter-400.ttf');if(r.ok){fontBuf['inter-400']=await r.arrayBuffer();return localFonts=true}}catch(_){}
 return localFonts=false;
}
const fontState={};
function ensureFont(k,full=true){
 const key=fkey(k);const st=fontState[key]||(fontState[key]={full:false,preview:false,p:null});
 if(full?st.full:(st.full||st.preview))return st.p||Promise.resolve();
 if(full)st.full=true;else st.preview=true;
 const job=(async()=>{
  const local=await canUseLocal();
  const want=full?(local?FONT_MANIFEST[key]:FONT_SOURCES[key][2]):[[400,0]];
  const tasks=[];
  for(const [w,i] of want){
   if(st['f'+w+i])continue;st['f'+w+i]=1;
   const desc={weight:String(w),style:i?'italic':'normal',display:'swap'};
   if(local){
    const name=`${key}-${w}${i?'i':''}`;
    tasks.push((async()=>{try{const buf=fontBuf[name]||(fontBuf[name]=await (await fetch('fonts/'+name+'.ttf')).arrayBuffer());const ff=new FontFace('CVX-'+key,buf.slice(0),desc);await ff.load();document.fonts.add(ff)}catch(_){}})());
   }else{
    const [pkg,ver]=FONT_SOURCES[key];const base=`https://cdn.jsdelivr.net/npm/@fontsource/${pkg}@${ver}/files/${pkg}`;
    for(const [sub,ur] of [['latin',UR_LATIN],['latin-ext',UR_EXT]]){
     const ff=new FontFace('CVX-'+key,`url(${base}-${sub}-${w}-${i?'italic':'normal'}.woff2) format("woff2")`,Object.assign({unicodeRange:ur},desc));
     document.fonts.add(ff);tasks.push(ff.load().catch(()=>{}));
    }
   }
  }
  await Promise.all(tasks);
  if(typeof fitZoom==='function'){fitZoom();markBreaks();refreshGlass()}
 })();
 st.p=job;return job;
}

/* ---------- export ---------- */
const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function printDoc(){
 const d=D();const keys=[...new Set([fkey(d.font),fkey(d.hfont||d.font),'inter'])];
 await Promise.all(keys.map(k=>ensureFont(k)));
 let faces='';
 for(const k of keys){
  if(localFonts){for(const [w,i] of FONT_MANIFEST[k]){const b=fontBuf[`${k}-${w}${i?'i':''}`];if(b)faces+=`@font-face{font-family:"CVX-${k}";font-weight:${w};font-style:${i?'italic':'normal'};src:url(data:font/ttf;base64,${b64(b)}) format("truetype")}`}}
  else{const [pkg,ver,list]=FONT_SOURCES[k];for(const [w,i] of list)for(const [sub,ur] of [['latin',UR_LATIN],['latin-ext',UR_EXT]])faces+=`@font-face{font-family:"CVX-${k}";font-weight:${w};font-style:${i?'italic':'normal'};unicode-range:${ur};src:url(https://cdn.jsdelivr.net/npm/@fontsource/${pkg}@${ver}/files/${pkg}-${sub}-${w}-${i?'italic':'normal'}.woff2) format("woff2")}`}
 }
 return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(S.profile.name)} - CV</title><style>${faces}html,body{margin:0;background:#fff}${$('#cv-css').textContent}</style></head><body>${renderCV(S.template,Object.assign({},D(),{__bake:true}))}<script>document.fonts&&document.fonts.ready.then(function(){setTimeout(function(){window.print()},400)})<\/script></body></html>`;
}
function printSettings(pages){
 const rows=[['Destination','Save as PDF','Not "Microsoft Print to PDF", which can save text as images.'],['Pages','All',''],['Pages per sheet','1',''],
  ['Margins',pages>1?'Default':'None',pages>1?'Your CV has '+pages+' pages; Default gives page 2 a top margin.':'The design already has its own margins.'],
  ['Paper size','A4','Under "More settings".'],['Scale','Default (100)','Under "More settings".'],['Background graphics','On or off','Colours print either way; on is safest.']];
 return `<div class="settings-wrap"><table class="settings">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}${r[2]?`<small>${r[2]}</small>`:''}</td></tr>`).join('')}</table></div>`;
}
async function exportPdf(){
 if(isBlank(S)){toast('Your CV is empty. Add your details in Content first, then export.');return}

 const pages=pageCount();
 const go=()=>{const t=document.title;document.title=`${S.profile.name} - CV`;setTimeout(()=>{window.print();setTimeout(()=>document.title=t,1500)},60)};

  $('#goPrint').addEventListener('click',()=>{if($('#tipOff').checked){try{localStorage.setItem('aurora-print-tip','off')}catch(_){}}closeModal();go()});
  return;
 }
 modal(`<h3>Export an ATS-ready PDF</h3><p>This shared page can't open the print window, so download a print-ready copy. Open it in Chrome or Edge; the print window appears by itself. Use these settings:</p>${printSettings(pages)}
  <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" id="dlPrint">Download print file</button></div>`);
 $('#dlPrint').addEventListener('click',async()=>{const b=$('#dlPrint');b.disabled=true;b.textContent='Preparing…';const html=await printDoc();closeModal();if(await offerFile(fileBase()+'-CV.html',html,'text/html'))toast('Downloaded. Open it and save your PDF with the settings shown.')});
}
